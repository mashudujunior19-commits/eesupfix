name: eesup_app
description: "A new Flutter project."
publish_to: 'none'
version: 16.2.7

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shorebird_code_push: ^1.1.3
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/animations/
    - .dev.env
    - .env
    - shorebird.yaml